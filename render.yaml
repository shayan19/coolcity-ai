services:
  - type: web
    name: coolcity-ai-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: python -m pip install "pip==26.2.1" && python -m pip install --requirement backend/requirements.lock.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: FORTYGUARD_BASE_URL
        value: https://api.fortyguard.com
      - key: COOLCITY_CACHE_ROOT
        value: /tmp/coolcity-cache
      - key: COOLCITY_ALLOWED_ORIGINS
        sync: false
